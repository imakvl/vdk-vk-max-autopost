name: Test MAX video upload

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install requests yt-dlp

      - name: Test MAX video upload
        env:
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
        run: python test_max_video.py
