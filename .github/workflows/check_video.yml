name: Check VK video

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Inspect VK video
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python check_video.py
